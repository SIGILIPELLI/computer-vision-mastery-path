site_name: Computer Vision Mastery Path
site_description: A free computer vision course — OpenCV fundamentals, CNNs, object detection, segmentation, tracking, OCR and vision transformers.
site_url: https://sigilipelli.github.io/computer-vision-mastery-path/
repo_url: https://github.com/sigilipelli/computer-vision-mastery-path
repo_name: computer-vision-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Image Fundamentals & Classical CV":
      - Overview: level-1/index.md
      - "01 · Images as Arrays: Pixels, Channels & Color Spaces": level-1/01-images-as-arrays.md
      - "02 · Image I/O, Resizing & Color Space Conversions": level-1/02-image-io-resizing-colorspaces.md
      - "03 · Filtering & Convolution: Blur, Sharpen, Edge Detection": level-1/03-filtering-convolution.md
      - "04 · Thresholding & Morphological Operations": level-1/04-thresholding-morphology.md
      - "05 · Contours & Shape Analysis": level-1/05-contours-shape-analysis.md
      - "06 · Feature Detection: Corners, Keypoints & Descriptors": level-1/06-feature-detection.md
      - "07 · Feature Matching & Homography: Aligning Images": level-1/07-feature-matching-homography.md
      - "08 · Image Augmentation for Training": level-1/08-image-augmentation.md
      - "09 · Classical Object Detection: Template Matching & Haar Cascades": level-1/09-classical-object-detection.md
      - "10 · Project — a Real Classical CV Pipeline (Document Scanner)": level-1/10-project-document-scanner.md
  - "Level 2 · CNNs & Image Classification":
